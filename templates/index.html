<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <!-- PWA Theme -->
    <meta
        name="theme-color"
        content="#0b0d12"
    >

    <!-- App Description -->
    <meta
        name="description"
        content="Simple modern mobile calculator built with Flask."
    >

    <!-- PWA Manifest -->
    <link
        rel="manifest"
        href="{{ url_for('static', filename='manifest.json') }}"
    >

    <!-- Apple / iPhone PWA Support -->
    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Calculator"
    >

    <title>Calculator</title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


    <!-- =========================
         APP
    ========================== -->

    <main class="app">


        <!-- =========================
             TOP BAR
        ========================== -->

        <header class="top-bar">

            <div class="app-brand">

                <div class="app-icon">
                    <span>💘</span>
                </div>

                <div>

                    <h1>Calculator</h1>

                </div>

            </div>


            <button
                class="icon-button"
                id="themeBtn"
                aria-label="Change theme"
                type="button"
            >
                ☀
            </button>

        </header>



        <!-- =========================
             CALCULATOR
        ========================== -->

        <section
            class="calculator-card"
            aria-label="Calculator"
        >


            <!-- =========================
                 DISPLAY
            ========================== -->

            <div
                class="display"
                aria-live="polite"
            >

                <div
                    id="previousDisplay"
                    class="previous-display"
                >
                    0
                </div>


                <div
                    id="currentDisplay"
                    class="current-display"
                >
                    0
                </div>

            </div>



            <!-- =========================
                 BUTTON AREA
            ========================== -->

            <div class="buttons">


                <!-- =====================
                     ROW 1
                ====================== -->

                <button
                    type="button"
                    class="calc-btn utility"
                    data-action="clear"
                    aria-label="Clear calculator"
                >
                    AC
                </button>


                <button
                    type="button"
                    class="calc-btn utility"
                    data-action="delete"
                    aria-label="Delete"
                >
                    ⌫
                </button>


                <button
                    type="button"
                    class="calc-btn utility"
                    data-action="percent"
                    aria-label="Percentage"
                >
                    %
                </button>


                <button
                    type="button"
                    class="calc-btn operator"
                    data-operator="/"
                    aria-label="Divide"
                >
                    ÷
                </button>



                <!-- =====================
                     ROW 2
                ====================== -->

                <button
                    type="button"
                    class="calc-btn number"
                    data-number="7"
                >
                    7
                </button>


                <button
                    type="button"
                    class="calc-btn number"
                    data-number="8"
                >
                    8
                </button>


                <button
                    type="button"
                    class="calc-btn number"
                    data-number="9"
                >
                    9
                </button>


                <button
                    type="button"
                    class="calc-btn operator"
                    data-operator="*"
                    aria-label="Multiply"
                >
                    ×
                </button>



                <!-- =====================
                     ROW 3
                ====================== -->

                <button
                    type="button"
                    class="calc-btn number"
                    data-number="4"
                >
                    4
                </button>


                <button
                    type="button"
                    class="calc-btn number"
                    data-number="5"
                >
                    5
                </button>


                <button
                    type="button"
                    class="calc-btn number"
                    data-number="6"
                >
                    6
                </button>


                <button
                    type="button"
                    class="calc-btn operator"
                    data-operator="-"
                    aria-label="Subtract"
                >
                    −
                </button>



                <!-- =====================
                     ROW 4
                ====================== -->

                <button
                    type="button"
                    class="calc-btn number"
                    data-number="1"
                >
                    1
                </button>


                <button
                    type="button"
                    class="calc-btn number"
                    data-number="2"
                >
                    2
                </button>


                <button
                    type="button"
                    class="calc-btn number"
                    data-number="3"
                >
                    3
                </button>


                <button
                    type="button"
                    class="calc-btn operator"
                    data-operator="+"
                    aria-label="Add"
                >
                    +
                </button>



                <!-- =====================
                     ROW 5
                ====================== -->

                <button
                    type="button"
                    class="calc-btn utility"
                    data-action="sign"
                    aria-label="Change sign"
                >
                    +/−
                </button>


                <button
                    type="button"
                    class="calc-btn number zero"
                    data-number="0"
                >
                    0
                </button>


                <button
                    type="button"
                    class="calc-btn number"
                    data-number="."
                    aria-label="Decimal"
                >
                    .
                </button>


                <button
                    type="button"
                    class="calc-btn equals"
                    id="equalsBtn"
                    aria-label="Equals"
                >
                    =
                </button>

            </div>

        </section>



        <!-- =========================
             MOBILE SAFE AREA
        ========================== -->

        <div class="bottom-space"></div>


    </main>



    <!-- =========================
         MAIN JAVASCRIPT
    ========================== -->

    <script
        src="{{ url_for('static', filename='js/script.js') }}"
    ></script>



    <!-- =========================
         PWA SERVICE WORKER
    ========================== -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker
                        .register(
                            "{{ url_for('static', filename='service-worker.js') }}"
                        )
                        .then(function (registration) {

                            console.log(
                                "PWA Service Worker registered:",
                                registration.scope
                            );

                        })
                        .catch(function (error) {

                            console.error(
                                "Service Worker registration failed:",
                                error
                            );

                        });

                }
            );

        }

    </script>


</body>

</html>
